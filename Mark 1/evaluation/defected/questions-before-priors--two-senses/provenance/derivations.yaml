- id: D6
  states: appendix/appendix.md#persistence-payoffs
  symbols:
    beta:
      domain: nonnegative
      meaning: 'demand parameter in [0, 1]: the share of unit value a customer pays for the wrong architecture'
  assumptions:
  - beta >= 0
  - beta <= 1
  quantities:
    pi_row_firm: (1 + 1 + 1/2 + 1/2)/4
    pi_coarse_firm: (0 + 0 + 1/2 + 1/2)/4
    pooled_on_wrong_architecture: beta/2
