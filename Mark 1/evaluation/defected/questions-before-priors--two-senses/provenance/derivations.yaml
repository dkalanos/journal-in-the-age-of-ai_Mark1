derivations:
- id: D1
  states: appendix/appendix.md#dominance-thresholds
  symbols:
    p0:
      domain: nonnegative
      meaning: belief mass on theories assigning theta^0 at the awareness cell
    p1:
      domain: nonnegative
      meaning: belief mass on theories assigning theta^1 at the awareness cell
    beta:
      domain: nonnegative
      meaning: 'demand parameter in [0, 1]: the share of unit value a customer pays for the wrong architecture'
  assumptions:
  - p0 >= 0
  - p1 > 0
  - beta >= 0
  - beta <= 1
  quantities:
    gain_vs_rival_0: p0/2 - (1 - beta/2)*p1
    gain_vs_rival_1: (1 - beta/2)*p0 - p1/2
    threshold: p0 - (2 - beta)*p1
  comparative_statics:
  - of: threshold
    wrt: beta
    stated_sign: positive
  examples:
  - params:
      p0: 0.6
      p1: 0.4
      beta: 1
    expected:
      gain_vs_rival_0: 0.1
      gain_vs_rival_1: 0.1
      threshold: 0.2
  - params:
      p0: 0.6
      p1: 0.4
      beta: 0
    expected:
      threshold: -0.2
- id: D2
  states: appendix/appendix.md#per-token-gain-and-deliberative-leverage
  symbols: &id001
    T:
      domain: positive
      meaning: the common valuation horizon
    r:
      domain: positive
      meaning: the number of tokens in the deliberative record, |r_i|
    Lfine:
      domain: nonnegative
      meaning: robust fine-contingent value of the best coherent grouping
    Lcur:
      domain: nonnegative
      meaning: current-language benchmark of the same grouping
  assumptions:
  - T > 0
  - r > 0
  - Lfine >= Lcur
  quantities:
    J: Lfine - Lcur
    B: (T/r)*(Lfine - Lcur)
  examples:
  - params:
      T: 2
      r: 2
      Lfine: 0.5
      Lcur: 0
    expected:
      J: 0.5
      B: 0.5
  - params:
      T: 2
      r: 4
      Lfine: 1
      Lcur: 0
    expected:
      J: 1
      B: 0.5
  - params:
      T: 2
      r: 4
      Lfine: 0
      Lcur: 0
    expected:
      J: 0
      B: 0
- id: D3
  states: paper/paper.md#example-1-continued-5
  symbols:
    Coh:
      domain: nonnegative
      meaning: representation-relative coherence, the acting-belief probability of the formulated theory
    W:
      domain: nonnegative
      meaning: selection-adjusted warrant of the formulated theory
  quantities:
    gap: Coh - W
  examples:
  - params:
      Coh: 1
      W: 0.5
    expected:
      gap: 0.5
- id: D4
  states: paper/paper.md#def-test
  symbols:
    b:
      domain: positive
      meaning: dissonance capacity, the log-evidence threshold for rejecting a theory
    b1:
      domain: positive
      meaning: dissonance capacity of agent 1
    b2:
      domain: positive
      meaning: dissonance capacity of agent 2
  assumptions:
  - b > 0
  - b1 > 0
  - b2 > 0
  quantities:
    false_alarm_bound: exp(-b)
    residual_two_agents: exp(-b1) + exp(-b2)
  comparative_statics:
  - of: false_alarm_bound
    wrt: b
    stated_sign: negative
  examples:
  - params:
      b: 3
      b1: 3
      b2: 3
    expected:
      false_alarm_bound: 0.049787068367863944
      residual_two_agents: 0.09957413673572789
- id: D5
  states: appendix/appendix.md#part-a
  symbols:
    n:
      domain: positive
      meaning: the number of agents
    S:
      domain: positive
      meaning: the number of states, |S|
  assumptions:
  - n >= 2
  - S >= 2
  quantities:
    cells_at_start: n
    cells_at_most: n*S
    refinements_at_most: n*(S - 1)
