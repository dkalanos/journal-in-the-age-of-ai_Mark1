claims:
- id: C1
  kind: contribution
  main: true
  text: 'Existing models show how theories guide learning, how Bayesian agents discriminate among represented
    causal structures, and how play can reveal previously unavailable actions. This paper models a different
    transition: an agent''s causal language pools objectively different situations; strategic experience
    endogenously reveals an action-relevant failure of that pooling and thereby creates a localized open
    question; costly inquiry activates a fallible technology whose output is not measurable in the agent''s
    prior awareness; only after that output is formulated does the agent construct a prior and undertake
    Bayesian judgment, under an explicit account of how much confidence the generating experience licenses.
    Because actions depend on theories, play can either create the contrasts that generate questions or
    suppress them, so the model also delivers the population-level answer: when theory heterogeneity and
    performance differences persist, and when the market erases them.'
  condition: null
  pointer: paper/paper.md#statement-of-contribution
  evidence_pointer: paper/paper.md:L41-L160
  derivation_id: null
- id: C2
  kind: result
  form: proposition
  main: true
  text: Proposition 4.1 (No Bayesian emergence). Bayesian conditioning on any event measurable with respect
    to the algebra generated by P_i yields a posterior on Delta(M(P_i)). No sequence of such updates makes
    a theory outside M(P_i) expressible or a distinction finer than P_i usable in a policy.
  condition:
  - the event conditioned on is measurable with respect to the algebra generated by P_i
  pointer: paper/paper.md#prop-no-emergence
  evidence_pointer: paper/paper.md#proof-prop-no-emergence
  derivation_id: D7
- id: C3
  kind: result
  form: example
  main: false
  text: 'Example 1 (continued, section 4). Under the coarse partition P_i^0 = {S}, firm i''s expressible
    theories are the constant assignments m^0, m^1, m^n. The row law tau is inexpressible: no reweighting
    of {m^0, m^1, m^n}, on any evidence, produces it. A firm that later observes payoffs irreconcilable
    with all three theories finds its posterior undefined, not alarmed: misspecification announces itself
    only because likelihoods hit zero exactly; with stochastic mechanisms no announcement would occur
    at all.'
  condition: null
  pointer: paper/paper.md#example-1-continued
  evidence_pointer: paper/paper.md:L469-L543
  derivation_id: null
- id: C4
  kind: result
  form: lemma
  main: true
  text: Lemma 5.2 (Test consistency). Fix a committed profile played in all generations and suppose no
    theory's distance to an on-path conditional equals eta exactly. As generations accumulate, almost
    surely every eta-adequate theory is eventually always in the active set and every eta-inadequate theory
    is eventually never in it.
  condition:
  - a committed profile is played in all generations
  - TV(p_i*(. | C, a), marg_i m(C)(a)) != eta for every theory m and visited pair (C, a)
  pointer: paper/paper.md#lem-test-consistency
  evidence_pointer: paper/paper.md#proof-lem-test-consistency
  derivation_id: D16
- id: C5
  kind: result
  form: proposition
  main: true
  text: Proposition 5.5 (Exposure and dissonance). Under a fixed committed profile, agent i experiences
    dissonance from some generation onward almost surely if and only if P_i is exposed.
  condition:
  - a fixed committed profile
  - 'TV(p_i*(. | C, a), marg_i m(C)(a)) != eta for every theory m and visited pair (C, a) (the hypothesis
    of Lemma 5.2, through which the proof runs)'
  pointer: paper/paper.md#prop-exposure
  evidence_pointer: paper/paper.md:L571-L653
  derivation_id: D8
- id: C6
  kind: result
  form: example
  main: false
  text: Example 1 (continued, section 5, opening policies). With beta = 1 and heterogeneous priors over
    the constant theories (firm 1 considers theta^0 more likely than theta^1, firm 2 the reverse), a direct
    computation shows that, against any conjecture about the rival, offering architecture 0 is subjectively
    strictly dominant for firm 1 and architecture 1 for firm 2 whenever mu_i(m^a) > (2 - beta) mu_i(m^a');
    at beta = 1 this is simple belief asymmetry. The firms therefore commit to differentiated constant
    policies.
  condition: null
  pointer: paper/paper.md#example-1-continued-2
  evidence_pointer: appendix/appendix.md#dominance-thresholds
  derivation_id: D1
- id: C7
  kind: result
  form: example
  main: false
  text: 'Example 1 (continued, section 5, discovery and concealment). In a generation in which s00 and
    s11 are served under differentiated actions, the winner-take-all payoffs reveal the objectively preferred
    architecture at each state: firm 1 wins at s00 (payoffs 1, 0) and loses at s11 (payoffs 0, 1). No
    constant assignment is consistent with both episodes (m^0 fails at s11, m^1 at s00, and m^n predicts
    one-half at both), so each firm''s active set empties: causal dissonance in its exact deterministic
    form. Had the firms instead pooled on the same architecture at both states, each would have received
    one-half at every episode, consistent with all three constant theories: the pooled profile is concealing,
    and coarse awareness would have survived its own evidence indefinitely.'
  condition: null
  pointer: paper/paper.md#example-1-continued-2
  evidence_pointer: paper/paper.md:L663-L683
  derivation_id: D4
- id: C8
  kind: result
  form: proposition
  main: true
  text: Proposition 6.2 (Cellwise coherence). Call a cell of a refinement coherent if some single mechanism
    passes the test on the cell's recoded observations. Then Mhat_i(P', r_i) != emptyset if and only if
    every cell of P' is coherent.
  condition:
  - P' strictly refines P_i and the retained record is recoded to the cells of P'
  pointer: paper/paper.md#prop-coherence
  evidence_pointer: paper/paper.md#proof-prop-coherence
  derivation_id: D17
- id: C9
  kind: result
  form: proposition
  main: true
  text: Theorem 6.5 (Observational nonidentification). Let tau != tau' be objective assignments inducing
    the same distribution over agent i's records under the committed profiles played. Then any truth-blind
    technology, and any truth-blind inquiry-and-formulation rule, has the same output distribution in
    both worlds. If no single theory is eta-adequate under both worlds at the visited pairs, no truth-blind
    rule selects an adequate formulation with probability one in both.
  condition:
  - tau != tau'
  - tau and tau' induce the same distribution over agent i's records under the committed profiles played
  - the technology and the inquiry-and-formulation rule are truth-blind
  - 'for the second statement: no single theory is eta-adequate under both worlds at the visited pairs'
  pointer: paper/paper.md#thm-nonidentification
  evidence_pointer: paper/paper.md#proof-thm-nonidentification
  derivation_id: D9
- id: C10
  kind: result
  form: proposition
  main: true
  text: Proposition 6.6 (Robust sufficiency). A partition sufficient for every assignment in a candidate
    set T must refine the join over tau' in T of P^tau', the join of the candidates' causal-equivalence
    partitions. A representation guaranteed to accommodate all observationally equivalent worlds is accordingly
    finer than any single world requires; a technology that economizes on distinctions must accept fallibility.
  condition:
  - the partition is sufficient for every assignment in the candidate set T
  pointer: paper/paper.md#prop-robust-sufficiency
  evidence_pointer: paper/paper.md:L783-L813
  derivation_id: D10
- id: C11
  kind: result
  form: example
  main: false
  text: 'Example 1 (continued, section 6.3). After the dissonant generation the record contains two labeled
    episodes: architecture 0 objectively preferred at s00, architecture 1 at s11. Of the fifteen partitions
    of four states, exactly four are minimally restorative, each separating s00 from s11: the row partition
    {{s00, s01}, {s10, s11}}, the column partition {{s00, s10}, {s01, s11}}, and the two partitions isolating
    one labeled state; the record directs inquiry (eleven partitions are excluded) without determining
    it (four remain). Under a complexity ordering counting the coordinates needed to describe a refinement,
    a factor-seeking technology produces the row or the column refinement. The column world tau''(s_rc)
    = theta^c agrees with the row world at both labeled states, so the two worlds generate identical records;
    no truth-blind rule can formulate correctly in both, a randomized rule succeeds in the worst case
    with probability at most one-half, and a partition sufficient for both worlds must be the full partition
    into singletons. Whichever factor refinement arrives, its unique consistent theory extrapolates the
    wrong prediction to the two unlabeled states in one of the two worlds.'
  condition: null
  pointer: paper/paper.md#example-1-continued-3
  evidence_pointer: paper/paper.md:L783-L838
  derivation_id: D21
- id: C12
  kind: result
  form: proposition
  main: true
  text: 'Proposition 7.4 (Answer invariance and the participation rule). B_i(r_i) is well defined, computable
    from the deliberative record together with the known structure (Theta, u_i), and invariant across
    the elements of R(P_i, r_i): every Lambda_i-measurable rule is implementable after any successful
    production, and the maximand of equation (6) makes no reference to which repair arrives. Moreover
    B_i(r_i) >= 0. Electing inquiry has represented value lambda_i B_i(r_i) - gamma_i, so agent i elects
    if and only if lambda_i B_i(r_i) >= gamma_i; in particular, elections occur only at dissonant records
    that admit some repair. Finally, B_i(r_i) > 0 if and only if some pinned rule strictly and robustly
    improves on the carried-forward policy: questions whose every admissible answer supports current behavior
    are worthless at any positive cost, however much model multiplicity remains.'
  condition:
  - B_i(r_i) is defined by equation (6) under the subjective recurrence premise at a dissonant record
    with R(P_i, r_i) != emptyset, and B_i(r_i) = 0 otherwise
  - gamma_i > 0
  - lambda_i > 0
  - lambda_i <= 1
  - production is elective and dissonance-triggered (Assumption 7.1)
  pointer: paper/paper.md#prop-participation
  evidence_pointer: paper/paper.md#proof-prop-participation
  derivation_id: D11
- id: C13
  kind: result
  form: example
  main: false
  text: 'Example 1 (continued, section 7). At the dissonant record both firms'' committed constant policies
    disagree with exactly one revealed label (firm 1 lost at s11, firm 2 at s00). Every restorative refinement
    separates the two labeled tokens, and implementing a token''s revealed label at its recurrence gains
    exactly one-half against every rival action: if the rival plays the winning architecture the switch
    converts a differentiated loss (0) into a pooled half; if the rival switches, it converts a pooled
    half into a differentiated win (1). Hence B_i = 1/2 for both firms, and each elects inquiry if and
    only if lambda_i/2 >= gamma_i; the valuation uses no conjecture about the rival and no reference to
    which of the four admissible refinements might arrive, Theta_i(t) is a singleton, and the bound is
    exact. After a validation generation in which firm 1 has acquired the row refinement (certain of the
    true row assignment) and firm 2 the column refinement (certain of the false column assignment), their
    policies differ at the two off-diagonal states, firm 1 wins both, and the labels revealed there falsify
    firm 2''s assignment: B_1 = 0, so the firm holding the truth never inquires again and its awareness
    remains permanently incomplete; B_2 = 1, so firm 2 elects whenever lambda_2 >= gamma_2 and, upon success,
    is driven stepwise to complete awareness.'
  condition: null
  pointer: paper/paper.md#example-1-continued-4
  evidence_pointer: paper/paper.md:L965-L1011
  derivation_id: D2
- id: C14
  kind: result
  form: proposition
  main: true
  text: 'Theorem 8.2 (The insight is not evidence). If the technology is truth-blind, conditioning on
    the production event adds nothing to the record: W equals the ordinary reflective posterior of m''''s
    correctness given the record alone. Post-restoration fit is guaranteed by the restoration property,
    so passing the test carries no information beyond the record either. Among candidates in T that induce
    the same record distribution, prior odds are preserved exactly.'
  condition:
  - the technology is truth-blind
  - '(T, nu) is a reflective assessment problem: T is a finite set of candidate objective assignments
    and nu a full-support reflective prior'
  pointer: paper/paper.md#thm-uninformative
  evidence_pointer: paper/paper.md#proof-thm-uninformative
  derivation_id: D12
- id: C15
  kind: result
  form: proposition
  main: true
  text: 'Corollary 8.3 (Self-audit requires sufficiency for the candidates). The assessment (T, nu) is
    expressible by agent i only if P_i is sufficient for every tau'' in T, hence only if P_i refines the
    join of Proposition 6.6. An agent holding a minimal restoration therefore generally cannot formulate
    the comparison that measures its own warrant gap: the overconfidence is invisible from within the
    representation that produces it. Short of that refinement, warrant must be supplied externally, by
    fresh evidence whose likelihoods differ across candidates, by an assessor with broader awareness,
    or by a future self.'
  condition:
  - the assessment (T, nu) is expressible by agent i
  pointer: paper/paper.md#cor-self-audit
  evidence_pointer: paper/paper.md:L1069-L1116
  derivation_id: D13
- id: C16
  kind: result
  form: example
  main: false
  text: 'Example 1 (continued, section 8). Suppose firm i''s technology produces the column refinement.
    The recoded record pins the unique consistent theory (architecture 0 on the first column, 1 on the
    second) and representation-relative coherence assigns it probability one. In the reflective assessment
    with T = {row world, column world} and a symmetric prior, the two worlds generate identical records
    and the technology is truth-blind, so the reflective posterior equals the prior: W = 1/2, and the
    warrant gap is exactly one-half. The same gap afflicts the firm that acquires the row refinement:
    its coherence in the true assignment is also probability one and its warrant is also one-half. Neither
    firm can conduct this assessment itself, since expressing both candidate worlds requires the full
    partition into singletons. One fresh differentiated observation at an off-diagonal state closes the
    gap completely (the two worlds predict opposite labels there), while pooled observations, in any number,
    close nothing.'
  condition: null
  pointer: paper/paper.md#example-1-continued-5
  evidence_pointer: paper/paper.md:L1038-L1116
  derivation_id: D3
- id: C17
  kind: result
  form: proposition
  main: true
  text: 'Theorem 9.4 (Epistemic absorption). Under Assumption 9.3, almost surely: (a) at most n(|S| -
    1) refinements occur, and every agent''s awareness partition is eventually constant; (b) only finitely
    many inquiry elections occur; and (c) there is an almost surely finite generation after which no agent''s
    language changes and no agent pays an inquiry cost: every agent''s epistemic life thereafter is judged-Bayesian
    updating within a fixed language, punctuated at most by dissonance episodes that fail the participation
    threshold. Moreover, on the event that the committed profile is eventually constant, (d) every agent''s
    active set is eventually constant, every theory it contains is eta-adequate under the terminal play
    at every recurrent observation pair, and each agent is eventually either never dissonant (it lives
    in a Bayesian world) or in dissonant stasis: dissonance recurs while lambda_i B_i < gamma_i, in particular
    whenever B_i = 0, as at irreparable records (R(P_i, r_i) = emptyset).'
  condition:
  - 'eta is generic: TV(p_i*(. | C, a), marg_i m(C)(a)) != eta for every agent, theory, partition profile
    and policy profile (Assumption 9.3(i))'
  - the randomization in each phi_i is independent across elections and of the state and consequence draws
    (Assumption 9.3(ii))
  - Pr(production succeeds | election) >= pi_lower
  - pi_lower > 0
  - 'for part (d): the committed profile is eventually constant'
  pointer: paper/paper.md#thm-absorption
  evidence_pointer: appendix/appendix.md:L1-L84
  derivation_id: D14
- id: C18
  kind: result
  form: proposition
  main: true
  text: 'Proposition 9.5 (Rest points and persistence). (i) If awareness partitions, committed policies,
    conjectures, and acting beliefs are all eventually constant almost surely, then the limiting configuration,
    restricted to the agents not in dissonant stasis, is a self-confirming unawareness equilibrium. (ii)
    Conversely, consider a configuration whose epistemic states satisfy the SCUE conditions, whose play
    generates only records with B_i = 0, and in which each agent''s committed action at each cell is strictly
    optimal under every conjecture and every theory in its active set. (a) With deterministic mechanisms,
    the configuration persists: dissonance, elections, and policy changes never occur, and the SCUE conditions
    continue to hold, with conjectures converging empirically to induced play. (b) With stochastic mechanisms,
    suppose in addition that every theory in every active set is eta''-adequate under the configuration''s
    play for some eta'' < eta, and that the strict optimality extends to every (eta + epsilon)-adequate
    theory for some epsilon in (0, 2(eta - eta'')]. Then for every delta > 0 there is a count threshold
    N(delta) such that, if the configuration is reached with at least N(delta) observations at every recurrent
    pair, then with probability at least 1 - delta play never changes, dissonance and elections never
    occur, and the SCUE conditions hold in every subsequent generation, with conjectures converging empirically
    to induced play.'
  condition:
  - '(i): awareness partitions, committed policies, conjectures and acting beliefs are all eventually
    constant almost surely'
  - '(i): Assumption 9.3 (the proof of (i) invokes Theorem 9.4(b) and (d))'
  - '(ii): the epistemic states satisfy the SCUE conditions (i)-(iv) of Definition 9.1'
  - '(ii): play generates only records with B_i = 0'
  - '(ii): each agent''s committed action at each cell is strictly optimal under every conjecture and
    every theory in its active set'
  - '(ii-a): mechanisms are deterministic'
  - '(ii-b): mechanisms are stochastic'
  - '(ii-b): eta'' < eta'
  - '(ii-b): every theory in every active set is eta''-adequate under the configuration''s play'
  - '(ii-b): epsilon > 0'
  - '(ii-b): epsilon <= 2*(eta - eta'')'
  - '(ii-b): strict optimality extends to every (eta + epsilon)-adequate theory'
  - '(ii-b): delta > 0'
  - '(ii-b): the configuration is reached with at least N(delta) observations at every recurrent pair'
  pointer: paper/paper.md#prop-rest-points
  evidence_pointer: appendix/appendix.md:L86-L149
  derivation_id: D15
- id: C19
  kind: result
  form: proposition
  main: true
  text: 'Proposition 9.8 (On-path adequacy, and where error lives). In a SCUE, every theory in the support
    of every mu_i is eta-adequate at every visited pair. All surviving falsity is confined to what the
    configuration does not expose: mechanism assignments at states pooled with causally different states
    whose mixture imitates a single mechanism at the visited profiles, and counterfactual claims at unvisited
    profiles.'
  condition:
  - the configuration is a SCUE (Definition 9.1)
  pointer: paper/paper.md#prop-adequacy
  evidence_pointer: paper/paper.md#proof-prop-adequacy
  derivation_id: D18
- id: C20
  kind: result
  form: proposition
  main: true
  text: 'Proposition 9.9 (Persistent performance differences). There exist primitives and absorbing configurations
    in which agents hold different terminal partitions and theories, expected per-generation payoffs differ
    strictly and permanently, and no disadvantaged agent has a priced repair: for each such agent either
    B_i = 0 or lambda_i B_i < gamma_i. The proof is by the instances of Example 1.'
  condition: []
  pointer: paper/paper.md#prop-persistence
  evidence_pointer: paper/paper.md:L1289-L1356
  derivation_id: D19
- id: C21
  kind: result
  form: proposition
  main: true
  text: 'Proposition 9.11 (No payoff-relevant error in diagnostic environments). In a diagnostic environment,
    every SCUE is free of payoff-relevant error. Payoff-relevant falsity survives only in environments
    that admit concealing profiles, and it requires them to be sustained: collective error needs the absence
    of both corrective forces, strategic variety inside agents'' categories and environmental punishment
    of uniform misservice.'
  condition:
  - the primitives (Theta, tau, rho, u) are diagnostic (Definition 9.10)
  pointer: paper/paper.md#prop-diagnostic
  evidence_pointer: paper/paper.md:L1306-L1410
  derivation_id: D20
- id: C22
  kind: result
  form: example
  main: false
  text: 'Example 1 (continued, section 9, the trap and its knife edge). Set beta = 1 and suppose both
    firms acquired the column refinement after the discovery generation and became certain of the false
    column assignment. Each then plays the column policy; the firms pool at every state; every payoff
    is one-half; and one-half is exactly what the column theory predicts under pooled play. The configuration
    is a SCUE with payoff-relevant error: policies are subjectively optimal, conjectures confirmed, no
    dissonance ever occurs (the profile is concealing), and B_i = 0 for both firms, so the configuration
    survives even a free, infallible inquiry technology; the warrant gap is permanent, each firm remaining
    exactly half-warranted as unbounded experience accumulates. Now let beta < 1: in the first generation
    containing an off-diagonal state, the pooled firms receive beta/2 where their theory predicts one-half;
    the demand side reveals the label, dissonance returns, leverage turns positive, and the reflective
    posterior becomes degenerate. Payoff-relevant self-confirmation is a knife-edge property of perfectly
    forgiving demand (the beta < 1 environments are diagnostic), and the destroyed value 1 - beta at each
    misserved episode is itself the corrective signal.'
  condition: null
  pointer: paper/paper.md#example-1-continued-6
  evidence_pointer: paper/paper.md:L1306-L1356
  derivation_id: D4
- id: C23
  kind: result
  form: example
  main: false
  text: Example 1 (continued, section 9, persistence). With beta = 1, let firm 1 hold the row refinement
    and the true assignment while firm 2 remains coarse with gamma_2 > lambda_2 B_2. Firm 1 wins both
    off-diagonal states and splits the rest, earning three-quarters to firm 2's one-quarter, forever;
    firm 2 sits in dissonant stasis, its question priced below its cost. Every route out (strategic variety,
    demand harshness, cheaper inquiry) is exactly one of the model's named forces.
  condition: null
  pointer: paper/paper.md#example-1-continued-6
  evidence_pointer: paper/paper.md:L1289-L1356
