title: Formal provenance (provenance/derivations.yaml), the derivation behind each proposition stated checkably
type: object
required: [derivations]
properties:
  derivations:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, symbols]
      additionalProperties: false
      properties:
        id: {type: string, pattern: "^D[0-9]+$"}
        # closed_form (the default): an optimization or formula re-derived symbolically.
        # proof: a theorem-proof argument; the record names what each step rests on (protocol/formal.md#P6).
        kind: {enum: [closed_form, proof]}
        states:
          description: pointer to the heading where the paper states the result this derivation supports (P9)
          type: string
        claim_ids: {type: array, items: {type: string}}
        symbols:
          type: object
          additionalProperties:
            type: object
            required: [domain, meaning]
            properties:
              domain: {enum: [real, positive, nonnegative, negative, nonpositive]}
              meaning: {type: string}
        assumptions: {type: array, items: {type: string}}
        objective: {type: string}
        choice_var: {type: string}
        goal: {enum: [max, min]}
        solution: {type: object, additionalProperties: {type: string}}
        quantities: {type: object, additionalProperties: {type: string}}
        stated: {type: object, additionalProperties: {type: string}}
        comparative_statics:
          type: array
          items:
            type: object
            required: [of, wrt, stated_sign]
            properties:
              of: {type: string}
              wrt: {type: string}
              stated_sign: {enum: [positive, negative, zero]}
              claim_id: {type: string}
        examples:
          type: array
          items:
            type: object
            required: [params, expected]
            properties:
              params: {type: object, additionalProperties: {type: number}}
              expected: {type: object, additionalProperties: {type: number}}
              claim_id: {type: string}
        hypotheses:
          description: proof kind. What the proof assumes, each as the paper states it.
          type: array
          items: {type: string, minLength: 1}
        steps:
          description: proof kind. The argument in steps, each naming what it rests on.
          type: array
          minItems: 1
          items:
            type: object
            required: [says]
            additionalProperties: false
            properties:
              says: {type: string, minLength: 1}
              uses:
                description: "record pointers (they must resolve), or `cited: ...` for work outside the record"
                type: array
                items: {type: string, minLength: 1}
        conclusion: {type: string, minLength: 1}
      if:
        properties: {kind: {const: proof}}
        required: [kind]
      then:
        required: [id, symbols, hypotheses, steps, conclusion]
