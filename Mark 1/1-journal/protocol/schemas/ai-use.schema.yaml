title: The AI-use record (provenance/ai-use.yaml)
$defs:
  role: {enum: [drafting, derivation, code, record_keeping, generator, checks, editing, search]}
type: object
required: [entries]
properties:
  entries:
    type: array
    minItems: 1
    items:
      type: object
      required: [tool, role, scope_pointer, date, human_direction]
      properties:
        tool: {type: string}
        model_version: {type: [string, "null"]}
        role: {$ref: "#/$defs/role"}
        scope_pointer: {type: string}
        date: {type: string}
        human_direction: {type: string, minLength: 1}
  generator_run:
    type: [object, "null"]
    required: [generator_version, run_id]
    properties:
      generator_version: {type: string}
      run_id: {type: string}
