title: Generator payload, the AI appendix parts the generator writes
type: object
required: [definitions, procedure, claims, anchors]
additionalProperties: false
properties:
  definitions:
    type: array
    items:
      type: object
      required: [term, definition]
      properties:
        term: {type: string}
        definition: {type: string}
        formula: {type: [string, "null"]}
        not_to_be_confused_with: {type: [string, "null"]}
  procedure: {type: array, minItems: 1, items: {type: string}}
  claims: {type: array, minItems: 1, items: {$ref: "claims.schema.yaml#/$defs/claim"}}
  anchors: {type: array, minItems: 1, items: {$ref: "anchors.schema.yaml#/$defs/anchor"}}
