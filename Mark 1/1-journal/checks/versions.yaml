# Versions of the five published objects. Every findings report and certificate carries these.
protocol: formal-0.4  # 0.4: the contribution claim carries the question it answers, in the paper's words, with a pointer to where the paper states it (P4); 0.3: the AI appendix is the author's, the generator its reference implementation and the journal's fallback; the paper opens with a front notice; check (d) withdrawn, the stamp a fact on the report. 0.2: derivations of kind `proof` for theorem-proof papers; 0.1 records validate unchanged
checks: 0.7.0  # 0.7.0: the map places the claim on the question as the paper states it and says when the model read it otherwise; the question pointer resolves and resolution reads it; the answering brief asks for a work log; 0.6.0: the four kinds of newness are answer, question, reading, evidence, from two answers on each nearest work; 0.5.0: the front notice at Level 1, derivation dropped as a check; 0.4.0: the evidence map reads open-access introductions; 0.3.0: re-execution under perturbation (S9); 0.2.1: proofs are located only through their `states`; 0.2.0: the contribution check places claims against retrieved venues; 0.1.0 saw the hand list alone
generator: 0.2.0  # 0.2.0: writes the contribution claim's question and its pointer; 0.1.0 wrote the claims list without them
standard: formal-0.5  # 0.5: S6 places the claim on the question as the paper states it; an editor who reads it otherwise records the reading and the reason; 0.4: S6 names the four kinds of newness as answer, question, reading, evidence; 0.3: S9, results survive re-execution under perturbation; 0.2: S8, a proof names what it rests on
mapping: "0.3"  # 0.3: evidence that carries part of a claim proceeds to review with the finding carried (R9); 0.2: the derivation row went with check (d); 0.1: appendix F.1 plus two rows
interest_criteria: "0.1"
