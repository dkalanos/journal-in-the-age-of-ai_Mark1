# Venue lists the evidence map searches (appendix D.6). Published in advance; a journal switches lists on or off in `search`.
# Membership compiled 2026-10-21 from the sources named below; a coauthor checks it before use on a real paper.
# ISSNs: Crossref journal records keyed by each journal's print ISSN, with the electronic ISSN taken from Wikidata/OpenAlex where Crossref lacks one; print + electronic only.
version: "0.1"
search: [utd24, ft50, cabs4star, cabs4]
hand_list: false
# At most this many candidates are read from their introduction (a licensed or open-access copy, taken down the candidate list); the rest keep their abstract.
introductions: 20
# The journal's own copies of paywalled work, PDFs named by OpenAlex id or DOI, tried before open-access copies.
# Outside Mark 1 and never published: in this demonstration, copies Kalanoski supplied on 2026-10-22.
licensed_copies: ../_drop/licensed-copies
lists:
  utd24:
    name: UT Dallas 24
    source: https://jsom.utdallas.edu/the-utd-top-100-business-school-research-rankings/index.php
    note: "Taken from the \"List of Journals\" on the rankings overview page (the site's dedicated journals page is a script shell with no list); UTD spells two titles differently (\"Journal on Computing\", \"The Accounting Review\")."
  ft50:
    name: Financial Times 50
    source: https://library.novasbe.unl.pt/50-journals-used-in-ft-research-rank
    note: "The 2016 list (FT's own page, https://www.ft.com/ft50-journals, refuses automated fetch, so a library reproduction is cited). FT revised the list in April 2026, replacing Human Relations, Journal of Business Ethics and Organization Studies with Academy of Management Annals, American Sociological Review and Psychological Science; that revision is NOT applied here."
  cabs4star:
    name: "Chartered ABS Academic Journal Guide 2024, grade 4*"
    source: https://docs.google.com/spreadsheets/d/1AC3zhcbK4Kjb-ZkffDJTsujqLmKx5H9I/edit
    note: "AJG 2024 (published 30 Oct 2024) sits behind a free login at https://charteredabs.org/academic-journal-guide/academic-journal-guide-2024; grades come from this public spreadsheet copy, cross-checked title-for-title against a second copy (https://scmor.com/view/10554), which agrees on all 47 journals."
  cabs4:
    name: "Chartered ABS Academic Journal Guide 2024, grade 4"
    source: https://docs.google.com/spreadsheets/d/1AC3zhcbK4Kjb-ZkffDJTsujqLmKx5H9I/edit
    note: "Same copies and cross-check as cabs4star; both agree on all 98 journals. Titles follow the publisher, not the AJG spelling (e.g. AJG's \"Human Resource Management (USA)\", \"MIS Quarterly: Management Information Systems\")."
